[profile.default]
src = "src"
out = "out"
libs = ["lib"]
evm_version = "paris"
gas_reports = ["Lottery", "LotteryVRF", "LotteryEX"]

[profile.ci]
verbosity = 4

[fuzz]
runs = 10000
max_test_rejects = 1000000

[invariant]
runs = 10000
depth = 500
fail_on_revert = false

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
